# Blue/Green service - switch traffic by changing the 'slot' selector
apiVersion: v1
kind: Service
metadata:
  name: ranking-service-live
  namespace: llm-serving
  labels:
    app: ranking-service
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: ranking-service
    slot: blue  # Change to 'green' to switch traffic
