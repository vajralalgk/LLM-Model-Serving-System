apiVersion: v1
kind: ConfigMap
metadata:
  name: ranking-service-config
  namespace: llm-serving
data:
  APP_NAME: "llm-ranking-service"
  APP_ENV: "production"
  APP_HOST: "0.0.0.0"
  APP_PORT: "8000"
  APP_WORKERS: "4"
  MODEL_NAME: "sentence-transformers/all-MiniLM-L6-v2"
  MODEL_VERSION: "v1"
  MODEL_DEVICE: "cpu"
  MAX_BATCH_SIZE: "32"
  BATCH_TIMEOUT_MS: "15"
  LOG_LEVEL: "INFO"
  ENABLE_TRACING: "true"
  OTLP_ENDPOINT: "http://jaeger-collector.observability:4317"
  PROMETHEUS_ENABLED: "true"
  RATE_LIMIT: "100/minute"
  REDIS_URL: "redis://redis-master.llm-serving:6379/0"
