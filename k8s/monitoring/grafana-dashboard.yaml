{
  "dashboard": {
    "title": "LLM Ranking Service - Production Dashboard",
    "uid": "llm-ranking-dashboard",
    "timezone": "utc",
    "refresh": "5s",
    "panels": [
      {
        "title": "Request Rate (RPS)",
        "type": "graph",
        "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
        "targets": [
          {
            "expr": "rate(ranking_requests_total[1m])",
            "legendFormat": "{{status}}"
          }
        ]
      },
      {
        "title": "Latency Percentiles",
        "type": "graph",
        "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
        "targets": [
          {
            "expr": "histogram_quantile(0.50, rate(ranking_request_latency_ms_bucket[5m]))",
            "legendFormat": "p50"
          },
          {
            "expr": "histogram_quantile(0.95, rate(ranking_request_latency_ms_bucket[5m]))",
            "legendFormat": "p95"
          },
          {
            "expr": "histogram_quantile(0.99, rate(ranking_request_latency_ms_bucket[5m]))",
            "legendFormat": "p99"
          }
        ]
      },
      {
        "title": "Error Rate",
        "type": "graph",
        "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
        "targets": [
          {
            "expr": "rate(ranking_errors_total[5m])",
            "legendFormat": "{{error_type}}"
          }
        ]
      },
      {
        "title": "Batch Processing",
        "type": "graph",
        "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
        "targets": [
          {
            "expr": "histogram_quantile(0.95, rate(ranking_batch_size_bucket[5m]))",
            "legendFormat": "Batch Size p95"
          },
          {
            "expr": "histogram_quantile(0.95, rate(ranking_batch_latency_ms_bucket[5m]))",
            "legendFormat": "Batch Latency p95"
          }
        ]
      },
      {
        "title": "Active Requests",
        "type": "gauge",
        "gridPos": {"h": 8, "w": 6, "x": 0, "y": 16},
        "targets": [
          {
            "expr": "ranking_active_requests"
          }
        ]
      },
      {
        "title": "Queue Depth",
        "type": "gauge",
        "gridPos": {"h": 8, "w": 6, "x": 6, "y": 16},
        "targets": [
          {
            "expr": "ranking_queue_depth"
          }
        ]
      },
      {
        "title": "Circuit Breaker State",
        "type": "stat",
        "gridPos": {"h": 8, "w": 6, "x": 12, "y": 16},
        "targets": [
          {
            "expr": "ranking_circuit_breaker_state"
          }
        ]
      },
      {
        "title": "Model Version Distribution",
        "type": "piechart",
        "gridPos": {"h": 8, "w": 6, "x": 18, "y": 16},
        "targets": [
          {
            "expr": "ranking_model_version_requests_total",
            "legendFormat": "{{version}}"
          }
        ]
      }
    ]
  }
}
